<svg xmlns="http://www.w3.org/2000/svg" width="292" height="52" viewBox="0 0 292 52" role="img" aria-labelledby="title desc">
  <title id="title">AI Agent — MCP ready</title>
  <desc id="desc">Badge stating that Studio Map OS can be operated by AI agents through the Model Context Protocol.</desc>
  <defs>
    <clipPath id="corners">
      <rect width="292" height="52" rx="15" />
    </clipPath>
  </defs>
  <g clip-path="url(#corners)">
    <rect width="138" height="52" fill="#1c2328" />
    <rect x="138" width="154" height="52" fill="#03b5aa" />
  </g>
  <!-- connector glyph: two nodes joined by a link -->
  <g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" transform="translate(16 14)">
    <circle cx="5" cy="5" r="4" />
    <circle cx="19" cy="19" r="4" />
    <path d="M8 8l8 8" />
  </g>
  <g fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" letter-spacing="1.3">
    <text x="88" y="31" text-anchor="middle">AI AGENT</text>
    <text x="215" y="31" text-anchor="middle">MCP READY</text>
  </g>
</svg>
